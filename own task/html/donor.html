<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Become a Donor</title>
    <link rel="stylesheet" href="../css/donor.css">
    <link rel="icon" type="image/png" href="../images/dp_blood_4_you1-removebg-preview.png">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <img src="../images/dp_blood_4_you1-removebg-preview.png" alt="Blood 4 You Logo">
            <span>BLOOD 4 YOU</span>
        </div>

        <nav class="nav">
            <a href="../index.html"><button class="nav-btn">Home</button></a>
            <a href="../html/contact.html"><button class="nav-btn">Contact Us</button></a>
            <a href="../html/volunteer.html"><button class="nav-btn">Volunteer</button></a>
            <a href="./donor.html"><button class="nav-btn">Donate</button></a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <section class="page-container">

        <h1>🩸 Become a Donor</h1>
        <p class="subtitle">
            Please provide your details so our team can contact you.
        </p>

        <!-- FORM CARD -->
        <div class="form-card">
            <form id="donorForm">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" required>
                </div>

                <div class="form-group">
                    <label>Phone:</label>
                    <input type="tel" required>
                </div>

                <div class="form-group">
                    <label>Image:</label>
                    <input type="file">
                </div>

                <button type="submit">Submit</button>
            </form>
        </div>

        
        <div id="certificateSection" class="certificate-section">
            <h2>🎓 Get Your Certificate</h2>
            <p>Please fill the below form to get the certificate.</p>

            <a href="https://docs.google.com/forms/d/e/1FAIpQLSe_8cStwvpwI4cY6CYVTedISEfkwJIb9zu_d0A2gMDggHM29w/viewform?usp=header"
               target="_blank"
               class="form-link">
               Fill Google Form
            </a>
        </div>

    </section>

    <!-- EXTERNAL JS -->
    <script src="../js/donor.js"></script>
</body>
</html>
